name: Tests

# Runs the test suite on every push to main and on pull requests, on the oldest and the newest
# Python the package supports. Public repo, so Actions minutes cost nothing. Added 2026-10-27:
# until then the only workflow was the monthly provider smoke check, and nothing ran the tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: pip install -e . pytest
      - name: Run the tests
        run: pytest -q
