name: Publish to PyPI

# Manual only. Run it ON A RELEASE TAG:   gh workflow run publish.yml --ref v0.6.0
# Uses PyPI Trusted Publishing (OIDC), so no token is stored anywhere. PyPI trusts this exact
# repository + workflow + environment, configured once by the account owner as a publisher for
# project llm-failover-chain: owner agilepeter, repository llm-failover, workflow publish.yml,
# environment pypi. `publish: false` builds and hands off the files without uploading, as a check.
# The build job refuses anything that is not the tag matching the version in pyproject.toml.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (false = build and hand off only, as a check)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Refuse anything but the release tag for this version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::run this on tag v$VERSION, not $GITHUB_REF"; exit 1
          fi
          echo "publishing llm-failover-chain $VERSION from $GITHUB_REF"
      - name: Build and check the sdist and wheel
        run: |
          python -m pip install -q build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/llm-failover-chain
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: What would be uploaded
        run: ls -l dist/
      - name: Upload to PyPI
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
